spring:
  application:
    name: notes-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

frontend:
  origin: ${FRONTEND_ORIGIN}

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:8082}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
        add-additional-paths: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  structured:
    format:
      console: com.notesapp.logging.JsonLogFormatter
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.notesapp: ${LOG_LEVEL_APP:INFO}

app:
  version: ${APP_VERSION:@project.version@}
  environment: ${DEPLOYMENT_ENVIRONMENT:local}
