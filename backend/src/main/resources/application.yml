spring:
  application:
    name: notes-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

frontend:
  origin: ${FRONTEND_ORIGIN}

management:
  endpoints:
    web:
      exposure:
        include: health,info

# Структурированные логи (JSON, Elastic Common Schema) в stdout — без файлов,
# без сторонних библиотек, только встроенный форматтер Spring Boot 3.4+.
# requestId/userId прокидываются через MDC (см. RequestLoggingFilter, AuthInterceptor)
# и попадают в каждую JSON-строку лога автоматически.
logging:
  structured:
    format:
      console: ecs
  level:
    root: INFO
    com.notesapp: DEBUG
