spring:
  application:
    name: notes-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

frontend:
  origin: ${FRONTEND_ORIGIN}

management:
  endpoints:
    web:
      exposure:
        include: health,info
