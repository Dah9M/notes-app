services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Административная задача (Liquibase-миграции) — отдельный одноразовый процесс,
  # тем же changelog'ом и той же конфигурацией БД, что у backend, но не встроен в его старт.
  migrate:
    image: liquibase/liquibase:4.27
    volumes:
      - ./backend/src/main/resources/db/changelog:/liquibase/changelog
    command:
      - --changelog-file=db.changelog-master.yaml
      - --search-path=/liquibase/changelog
      - --url=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      - --username=${DB_USER}
      - --password=${DB_PASSWORD}
      - update
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build: ./backend
    image: notes-app-backend:${APP_VERSION:-dev}
    environment:
      DB_URL: ${DB_URL}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SERVER_PORT: ${SERVER_PORT}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build: ./frontend
    image: notes-app-frontend:${APP_VERSION:-dev}
    environment:
      API_BASE_URL: ${API_BASE_URL}
      PORT: 80
    ports:
      - "8081:80"
    depends_on:
      - backend

volumes:
  pgdata:
