apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  labels:
    app: migrate
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: migrate
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: migrate:0.0.1
          imagePullPolicy: IfNotPresent
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
          args:
            - --changelog-file=db.changelog-master.yaml
            - --search-path=/liquibase/changelog
            - --url=jdbc:postgresql://postgres:5432/notesdb
            - --username=$(DB_USER)
            - --password=$(DB_PASSWORD)
            - update
